<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Subtle inner circle accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.25"/>

  <!-- Stylized Luxury "M" and Crown/Star Motif -->
  <g transform="translate(0, -10)">
    <!-- Star/Crown Accent on top -->
    <path d="M 256 128 L 264 148 L 286 152 L 270 166 L 274 188 L 256 177 L 238 188 L 242 166 L 226 152 L 248 148 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

    <!-- Distinctive Geometric Serif 'M' for MILENIA -->
    <path d="M 152 350 L 152 210 L 202 210 L 256 296 L 310 210 L 360 210 L 360 350 L 320 350 L 320 256 L 272 334 L 240 334 L 192 256 L 192 350 Z" fill="url(#goldGrad)"/>
    
    <!-- Base Ribbon Line -->
    <path d="M 170 375 L 342 375" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>
</svg>
