<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="meniaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="meniaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Card Frame with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#meniaBg)"/>
  <rect width="492" height="492" x="10" y="10" rx="102" fill="none" stroke="url(#meniaGold)" stroke-width="3.5" stroke-opacity="0.5"/>
  
  <!-- Subtle Gastronomy Circle Accent -->
  <circle cx="256" cy="245" r="175" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.25"/>

  <!-- Logo Group -->
  <g transform="translate(0, -5)">
    <!-- Cloche Curve on top -->
    <path d="M 170 185 C 170 135, 342 135, 342 185" stroke="url(#meniaGold)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Cloche Knob / Star -->
    <circle cx="256" cy="120" r="16" fill="url(#meniaGold)" filter="url(#goldGlow)"/>
    <circle cx="256" cy="120" r="6" fill="#ffffff"/>

    <!-- Sharp, Bold Monogram 'M' -->
    <path d="M 148 350 L 148 215 L 198 215 L 256 305 L 314 215 L 364 215 L 364 350 L 324 350 L 324 265 L 272 344 L 240 344 L 188 265 L 188 350 Z" fill="url(#meniaGold)" filter="url(#goldGlow)"/>
    
    <!-- Base Ribbon Line / Underline -->
    <path d="M 140 378 L 372 378" stroke="url(#meniaGold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="378" r="6" fill="#fef08a"/>

    <!-- MENIA Text Under Emblem in SVG -->
    <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#ffffff">MENIA</text>
    <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="6" fill="#f59e0b">RESTAURANT</text>
  </g>
</svg>
